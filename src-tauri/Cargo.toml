[package]
name="nuendo-conform-helper"
version="0.1.0"
description="Cross-platform helper for Nuendo conform workflows"
authors= ["Astra Studio"]
edition="2021"

[lib]
name="nuendo_conform_helper_lib"
crate-type= ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build= {version="2",features= [] }

[dependencies]
tauri= {version="2",features= [] }
tauri-plugin-clipboard-manager="2"
tauri-plugin-dialog="2"
tauri-plugin-fs="2"
tauri-plugin-global-shortcut="2"
serde= {version="1",features= ["derive"] }
serde_json="1"
